apiVersion: 1

providers:
  # Shared/reference dashboards linked into from every team's overview: the
  # 2-tier family (2-tier-fullstack-analytics, 2-tier-no-host-analytics,
  # 2-tier-no-db-analytics, 2-tier-no-host-no-db-analytics), the 3-tier
  # family (3-tier-fullstack-analytics, 3-tier-no-host-analytics,
  # 3-tier-no-db-analytics), and authapi-analytics. No folder: key, so these
  # land in General -- every team folder can reach them.
  - name: 'core'
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/core

  - name: 'hr-finance'
    orgId: 1
    folder: 'HR and Finance'
    folderUid: 'folder-hr-finance'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/hr-finance

  - name: 'public-safety'
    orgId: 1
    folder: 'Public Safety'
    folderUid: 'folder-public-safety'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/public-safety

  - name: 'middleware'
    orgId: 1
    folder: 'Middleware'
    folderUid: 'folder-middleware'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/middleware

  - name: 'directors'
    orgId: 1
    folder: 'Directors'
    folderUid: 'folder-directors'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/directors

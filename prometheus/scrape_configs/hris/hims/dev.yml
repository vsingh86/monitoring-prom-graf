# HIMS -- development environment.
# See docs/onboarding-new-app.md for what each label (app/app_type/db_type/
# host_type/component/environment) does and why every job below must share
# app: HIMS.
# component: app|frontend-app|backend-app|host|frontend-host|backend-host|
# database identifies each job's role so dashboards can derive it from just
# $app -- HIMS has a genuine frontend/backend split, so it uses the split
# values (frontend-app/backend-app/frontend-host) instead of plain app/host.
scrape_configs:
# Oracle
  - job_name: hris-hims-db-dev  
    params:
      target: ["hris-hims-db"]
    static_configs:
      - targets: ["db-exporter:9433"]
        labels:
          db_type: oracle
          app: HIMS
          team: "HR and Finance"
          component: database
          environment: development
    relabel_configs:
      - source_labels: [__param_target]
        target_label: instance


  - job_name: hris-hims-infra-frontend-dev
    metrics_path: /metrics
    scrape_interval: 15s
    scheme: https
    basic_auth:
      username: admin
      password: byteme
    tls_config:
      # ca_file: /etc/prometheus/certs/spuappwebdvl.pem
      # server_name: SPUAPPWEBDVL.ad.seattle.gov
      insecure_skip_verify: true
    static_configs:
      - targets: ["spuappwebdvl:9182"]
        labels:
          app: HIMS
          team: "HR and Finance"
          host_type: windows
          component: frontend-host
          environment: development

  - job_name: 'hris-hims-app-backend-dev'
    scrape_interval: 15s
    authorization:
      type: Bearer
      credentials_file: /tmp/HRIS_HIMS_BE_METRICS_TOKEN
    metrics_path: /HIMSWebService/metrics
    static_configs: # use docker host internal temp
      - targets: ['spuappwebdvl:80']
        labels:
          app: HIMS
          team: "HR and Finance"
          app_type: dotnet-framework
          component: backend-app
          environment: development

  - job_name: "hris-hims-app-frontend-dev"
    authorization:
      type: Bearer
      credentials_file: /tmp/HRIS_HIMS_FE_METRICS_TOKEN
    scheme: https
    tls_config:
      # ca_file: /etc/prometheus/certs/spuappwebdvl.pem
      # server_name: SPUAPPWEBDVL.ad.seattle.gov
      insecure_skip_verify: true
    metrics_path: /HIMSWeb/metrics
    scrape_interval: 15s
    static_configs:
      - targets: ['spuappwebdvl:443']
        labels:
          app: HIMS
          team: "HR and Finance"
          app_type: dotnet-framework
          component: frontend-app
          environment: development
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'
rule_files:
  # Application HTTP metrics (normalized to app:* schema)
  - rules/data-mapping/nodejs.yml
  - rules/data-mapping/dotnet.yml
  - rules/data-mapping/dotnet_framework.yml
  - rules/data-mapping/java.yml
  # Infrastructure / host metrics (normalized to host:* schema)
  - rules/data-mapping/infra_linux.yml
  - rules/data-mapping/infra_windows.yml
  # Database metrics (normalized to db:* schema)
  - rules/data-mapping/db_postgres.yml
  - rules/data-mapping/db_mysql.yml
  - rules/data-mapping/db_sqlserver.yml
  - rules/data-mapping/db_oracle.yml
  # Alerting rules. 
  - rules/alerts/auth-service/*
  - rules/alerts/hims/*

# ── Onboarding a new app ─────────────────────────────────────────────────────
# Every job that belongs to an app — its application job, database job(s), and
# dedicated infra host job(s) — must carry the SAME `app: <Name>` static label.
# This is the join key 2-tier-fullstack-analytics.json uses to scope Layer 2
# (Infra) and Layer 4 (Database) to whichever app is selected via the $job
# dropdown; it resolves automatically once the label is consistent, no dashboard edits
# needed. See docs/onboarding-new-app.md for the full checklist and
# copy-paste job templates.
#
# Every scrape job lives under scrape_configs/<team>/<app>/<env>.yml instead
# of inline here. Same glob restriction as rule_files above applies here too
# (Prometheus rejects "*" in a directory component, only the final segment)
# -- so each app gets its own explicit line, with "*.yml" picking up every
# environment file under it automatically. Adding a new ENVIRONMENT for an
# existing app is a zero-edit change (just add the file); adding a brand new
# APP means adding one line below. scrape_configs/_platform.yml holds the
# handful of jobs with no single owning app (currently just Prometheus's own
# self-scrape).
scrape_config_files:
  - scrape_configs/_platform.yml
  - scrape_configs/hris/hims/*.yml
  - scrape_configs/hris/card/*.yml
  - scrape_configs/hris/authapi/*.yml
  - scrape_configs/hris/scl-eng-std/*.yml
